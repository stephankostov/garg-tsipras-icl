[project]
name = "garg-tsipras-icl"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "tqdm",
    "transformers",
    "wandb",
    "xgboost",
    "protobuf",
    "pyyaml>=6.0",
    "munch>=4.0.0",
]

[tool.uv]
package = false
 
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
 
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
